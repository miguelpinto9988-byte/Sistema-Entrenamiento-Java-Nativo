name: Compilar APK Android (Java)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
  pull_request:
    paths:
      - "app/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK de prueba
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          test -f settings.gradle || { echo "::error::Falta settings.gradle en la raíz"; exit 1; }
          test -f app/build.gradle || { echo "::error::Falta app/build.gradle. Subir el contenido de la carpeta del proyecto a la raíz."; exit 1; }

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Android de depuración
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-java-nativo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
