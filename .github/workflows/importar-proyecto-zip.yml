name: Importar proyecto completo desde ZIP
run-name: Importar proyecto Java nativo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de la publicación que contiene el ZIP (por ejemplo v0.1.0-java)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: importar-proyecto
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Obtener proyecto ZIP adjunto a la publicación
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zip"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Sistema_Entrenamiento_Java_Nativo_Proyecto.zip" \
            --dir "$RUNNER_TEMP/zip"
          test -s "$RUNNER_TEMP/zip/Sistema_Entrenamiento_Java_Nativo_Proyecto.zip"

      - name: Extraer y comprobar estructura sin rutas peligrosas
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          arc=pathlib.Path(os.environ['RUNNER_TEMP'])/'zip'/'Sistema_Entrenamiento_Java_Nativo_Proyecto.zip'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'extraido'
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(arc) as z:
              for e in z.infolist():
                  p=(dest/e.filename).resolve()
                  if not p.is_relative_to(dest.resolve()):
                      raise SystemExit('Ruta ZIP insegura: '+e.filename)
                  # No se aceptan enlaces simbólicos embebidos
                  if (e.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Enlace simbólico no permitido: '+e.filename)
              z.extractall(dest)
          roots=list(dest.rglob('settings.gradle'))
          roots=[p.parent for p in roots if (p.parent/'app'/'build.gradle').exists()]
          if len(roots)!=1:
              raise SystemExit(f'Estructura inesperada: {len(roots)} raíces de proyecto')
          src=roots[0]
          dst=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          for name in ('app','gradle','build.gradle','settings.gradle','gradle.properties','ESTADO_DE_MIGRACION.md'):
              old=src/name
              if not old.exists():
                  raise SystemExit('Falta archivo o carpeta: '+name)
              target=dst/name
              if old.is_dir():
                  import shutil
                  shutil.copytree(old,target,dirs_exist_ok=True)
              else:
                  import shutil
                  shutil.copy2(old,target)
          print('Importación local completada.')
          PY

      - name: Verificar componentes esenciales
        shell: bash
        run: |
          test -f app/build.gradle
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/catalog.json
          echo "Archivos incorporados:"
          find app gradle -type f | wc -l
          du -sh app

      - name: Crear commit y publicar el proyecto
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app gradle settings.gradle build.gradle gradle.properties ESTADO_DE_MIGRACION.md
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
          else
            git commit -m "import: proyecto Android Java nativo desde ZIP publicado"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
